name: Build NeuralVision APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          
      - name: Install NeuralVision icon resources
        run: |
          mkdir -p app/src/main/res
          unzip -o NeuralVision_icon_resources.zip -d /tmp/neuralvision_icons
          cp -r /tmp/neuralvision_icons/res/. app/src/main/res/

      - name: Build debug APK
        run: gradle assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuralVision-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
